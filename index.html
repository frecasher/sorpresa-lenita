<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <style>
    /* --- FONDO BASE --- */
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #F7FAFF;
      position: relative;
    }

    /* --- NUBES ACUARELA ORIGINALES (Tonos Vivos Restaurados) --- */
    .nube {
      position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0;
      z-index: 1; animation: aparecer 3s ease forwards; pointer-events: none;
    }
    /* Tonos azules y amarillos con la intensidad de tu imagen */
    .nube-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(117, 169, 232, 0.25); animation-delay: 0.2s; }
    .nube-2 { bottom: -20%; right: -10%; width: 55vw; height: 55vw; background: rgba(245, 201, 40, 0.15); animation-delay: 0.5s; } /* Amarillo fuerte abajo derecha */
    .nube-3 { top: 20%; right: 10%; width: 40vw; height: 40vw; background: rgba(117, 169, 232, 0.25); animation-delay: 0.8s; }
    .nube-4 { top: 35%; left: 25%; width: 40vw; height: 40vw; background: rgba(245, 201, 40, 0.15); animation-delay: 1.1s; } /* Amarillo fuerte en el centro detrás del botón */
    .nube-5 { bottom: -10%; left: -10%; width: 45vw; height: 45vw; background: rgba(117, 169, 232, 0.25); animation-delay: 1.4s; }

    /* --- CAPA MÁGICA: LUCIÉRNAGAS Y PÉTALOS AZULES --- */
    #capa-magia {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 3; pointer-events: none; overflow: hidden;
    }
    .luciernaga {
      position: absolute; width: 4px; height: 4px; background: #F5C928; border-radius: 50%;
      box-shadow: 0 0 10px #F5C928, 0 0 20px #F5C928; opacity: 0; 
      animation: flotarLuciernaga var(--dur) ease-in-out forwards;
    }
    @keyframes flotarLuciernaga {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }
    .petalo-cayendo {
      position: absolute; background: #75A9E8; border-radius: 40% 60% 40% 60%;
      opacity: 0; filter: drop-shadow(0 2px 4px rgba(11, 59, 130, 0.2));
      animation: caerPetalo var(--duracion) linear forwards;
    }
    @keyframes caerPetalo {
      0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.65; }
      90% { opacity: 0.65; }
      100% { transform: translateY(110vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* --- TUS FLORES EN LAS ESQUINAS ORIGINALES --- */
    .contenedor-flor {
      position: absolute; opacity: 0; z-index: 4;
      animation: aparecer 2s ease forwards 0.8s; pointer-events: none;
    }
    .esquina-arriba { top: 0; right: 0; }
    .esquina-abajo { bottom: 0; left: 0; }
    .flor-viento {
      position: absolute; transform-origin: center;
      animation: viento var(--duracion) ease-in-out infinite alternate var(--retraso);
    }
    @keyframes viento {
      0% { transform: rotate(calc(var(--rotacion) - 4deg)) translateY(0px); }
      50% { transform: rotate(calc(var(--rotacion) + 3deg)) translateY(-4px); }
      100% { transform: rotate(calc(var(--rotacion) - 2deg)) translateY(3px); }
    }

    /* --- TU CONTENIDO ORIGINAL EXACTO --- */
    .contenido {
      z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .hola-animado {
      font-size: 4rem; letter-spacing: 5px; margin-bottom: 10px; opacity: 0;
      animation: aparecer 1s ease forwards 2s; 
    }
    .hola-animado span {
      color: #21325E; font-weight: bold; animation: encenderGlow 3s infinite alternate;
    }
    /* Tiempos en cascada originales */
    .hola-animado span:nth-child(1) { animation-delay: 2.2s; }
    .hola-animado span:nth-child(2) { animation-delay: 2.3s; }
    .hola-animado span:nth-child(3) { animation-delay: 2.4s; }
    .hola-animado span:nth-child(4) { animation-delay: 2.5s; }
    .hola-animado span:nth-child(5) { animation-delay: 2.6s; }
    .hola-animado span:nth-child(6) { animation-delay: 2.7s; } 
    .hola-animado span:nth-child(7) { animation-delay: 2.8s; }
    .hola-animado span:nth-child(8) { animation-delay: 2.9s; }
    .hola-animado span:nth-child(9) { animation-delay: 3.0s; }
    .hola-animado span:nth-child(10) { animation-delay: 3.1s; }
    .hola-animado span:nth-child(11) { animation-delay: 3.2s; }
    .hola-animado span:nth-child(12) { animation-delay: 3.3s; }
    .hola-animado span:nth-child(13) { animation-delay: 3.4s; }
    
    .subtitulo {
      font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 40px; color: #3E497A;
      font-weight: bold; opacity: 0; animation: aparecerSubir 1s ease forwards 3.5s; 
    }
    
    .boton-siguiente {
      background-color: #F1D00A; color: #21325E; padding: 15px 40px; text-decoration: none;
      border-radius: 30px; font-weight: bold; font-size: 1.1rem; opacity: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      animation: aparecerPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 5s; 
      transition: all 0.3s ease;
    }
    .boton-siguiente:hover {
      background-color: #fdc500; transform: scale(1.1) !important; box-shadow: 0 0 20px rgba(241, 208, 10, 0.6);
    }

    /* --- ANIMACIONES ORIGINALES --- */
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    @keyframes aparecerSubir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes aparecerPop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes encenderGlow {
      0%, 15% { color: #21325E; text-shadow: none; opacity: 0.2; }
      85%, 100% { color: #00296b; text-shadow: 0 0 15px #F1D00A, 0 0 30px #fdc500; opacity: 1; }
    }

    /* --- SECUENCIA DE SALIDA (A VIDEO.HTML) --- */
    body.despidiendo .boton-siguiente { animation: desaparecerPop 0.4s ease both !important; }
    body.despidiendo .hola-animado, body.despidiendo .subtitulo { animation: desaparecer 0.6s ease both 0.4s !important; }
    body.despidiendo .contenedor-flor { animation: desaparecerFlor 0.8s ease both 0.9s !important; }
    body.despidiendo .nube, body.despidiendo #capa-magia { animation: desaparecer 1s ease both 1.5s !important; }

    @keyframes desaparecer { from { opacity: 1; } to { opacity: 0; } }
    @keyframes desaparecerPop { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.5); } }
    @keyframes desaparecerFlor { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }

  </style>
</head>
<body>

  <!-- NUBES ACUARELA ORIGINALES CON TONOS VIVOS -->
  <div class="nube nube-1"></div>
  <div class="nube nube-2"></div>
  <div class="nube nube-3"></div>
  <div class="nube nube-4"></div>
  <div class="nube nube-5"></div>

  <!-- CAPA DE MAGIA (LUCIÉRNAGAS Y PÉTALOS) -->
  <div id="capa-magia"></div>

  <!-- FLORES DE ESQUINA ORIGINALES -->
  <div class="contenedor-flor esquina-arriba">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 135deg; --duracion: 6s; --retraso: 0s; width: 320px; top: -60px; right: -60px; z-index: 2;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 90deg; --duracion: 5.5s; --retraso: 0.5s; width: 280px; top: 40px; right: -30px; z-index: 3;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 70deg; --duracion: 5.8s; --retraso: 0.8s; width: 240px; top: 200px; right: -30px; z-index: 1;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 50deg; --duracion: 6.5s; --retraso: 1.3s; width: 200px; top: 350px; right: -40px; z-index: 2;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 180deg; --duracion: 6.2s; --retraso: 1s; width: 280px; top: -40px; right: 120px; z-index: 3;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 200deg; --duracion: 5s; --retraso: 1.2s; width: 240px; top: -40px; right: 300px; z-index: 1;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 120deg; --duracion: 5.2s; --retraso: 1.5s; width: 220px; top: 50px; right: 200px; z-index: 5;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 45deg; --duracion: 4.8s; --retraso: 0.3s; width: 200px; top: 150px; right: 120px; z-index: 4;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 90deg; --duracion: 5.7s; --retraso: 0.7s; width: 180px; top: 250px; right: 80px; z-index: 4;">
  </div>
  
  <div class="contenedor-flor esquina-abajo">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -45deg; --duracion: 6.1s; --retraso: 0.2s; width: 320px; bottom: -60px; left: -60px; z-index: 2;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 0deg; --duracion: 5.4s; --retraso: 0.7s; width: 280px; bottom: 40px; left: -30px; z-index: 3;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 20deg; --duracion: 5.7s; --retraso: 0.4s; width: 240px; bottom: 200px; left: -30px; z-index: 1;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: 40deg; --duracion: 6.4s; --retraso: 1.1s; width: 200px; bottom: 350px; left: -40px; z-index: 2;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -90deg; --duracion: 5.9s; --retraso: 1.2s; width: 280px; bottom: -40px; left: 120px; z-index: 3;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -110deg; --duracion: 4.9s; --retraso: 1.5s; width: 240px; bottom: -40px; left: 300px; z-index: 1;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -60deg; --duracion: 6.3s; --retraso: 0.6s; width: 220px; bottom: 50px; left: 200px; z-index: 5;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -135deg; --duracion: 5.1s; --retraso: 1.0s; width: 200px; bottom: 150px; left: 120px; z-index: 4;">
    <img src="img/flores.png" class="flor-viento" style="--rotacion: -90deg; --duracion: 5.6s; --retraso: 0.8s; width: 180px; bottom: 250px; left: 80px; z-index: 4;">
  </div>

  <!-- TEXTOS ORIGINALES -->
  <div class="contenido">
    <div class="hola-animado">
      <span>H</span><span>o</span><span>l</span><span>a</span><span>a</span>
      <span>&nbsp;</span>
      <span>l</span><span>e</span><span>n</span><span>i</span><span>t</span><span>a</span><span>!</span>
    </div>
    <p class="subtitulo">ESTE DETALLE ES PARA TI :)</p>
    <a href="video.html" class="boton-siguiente" id="btn-entrar">CLICK AQUÍ</a>
  </div>

  <script>
    // Generador de Luciérnagas
    const capaMagia = document.getElementById('capa-magia');
    let intervaloLuciernagas = setInterval(() => {
      const luciernaga = document.createElement('div');
      luciernaga.className = 'luciernaga';
      luciernaga.style.left = Math.random() * 100 + 'vw';
      luciernaga.style.top = Math.random() * 80 + 20 + 'vh'; 
      luciernaga.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
      luciernaga.style.setProperty('--ty', -(Math.random() * 200 + 100) + 'px'); 
      luciernaga.style.setProperty('--dur', (Math.random() * 4 + 5) + 's');
      capaMagia.appendChild(luciernaga);
      setTimeout(() => luciernaga.remove(), 9000);
    }, 800);

    // Generador de Pétalos
    let intervaloPetalos = setInterval(() => {
      const petalo = document.createElement('div');
      petalo.className = 'petalo-cayendo';
      petalo.style.left = Math.random() * 100 + 'vw';
      petalo.style.background = Math.random() > 0.5 ? '#75A9E8' : '#8AB6F0';
      const size = Math.random() * 8 + 10; 
      petalo.style.width = size + 'px';
      petalo.style.height = size + 'px';
      petalo.style.setProperty('--duracion', (Math.random() * 6 + 8) + 's');
      capaMagia.appendChild(petalo);
      setTimeout(() => petalo.remove(), 14000);
    }, 1200);

    // Transición suave hacia video.html
    document.getElementById('btn-entrar').addEventListener('click', function(e) {
      e.preventDefault(); 
      const destino = this.href;
      
      document.body.classList.add('despidiendo');
      
      setTimeout(() => {
        window.location.href = destino;
      }, 2500);
    });
  </script>

</body>
</html>
